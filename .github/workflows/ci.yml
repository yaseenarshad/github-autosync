# CI: every pull request gets a typecheck, the unit-test suite and a bundle build.
# No Playwright/e2e — behaviour is verified by launching the dev app against a throwaway repo.
name: ci

on:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
