# CI: every pull request gets a typecheck, the unit-test suite and a bundle build, on both OSes we ship.
# No Playwright/e2e — behaviour is verified by launching the dev app against a throwaway repo.
name: ci

on:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
