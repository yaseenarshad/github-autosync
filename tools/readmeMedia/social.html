<!doctype html>
<!--
  The link preview, 1280 × 640 (GitHub: Settings › General › Social preview): the icon, the name,
  the line, and one picture of the REAL window at work on the stage (`shot`, which capture.mjs
  renders first). The important part sits in the middle, clear of the edges a preview crops.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub AutoSync link preview</title>
<style>
  html, body { margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; display: flex; align-items: center; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; background: radial-gradient(640px 520px at 940px 320px, rgba(46, 160, 67, .22), transparent 70%), linear-gradient(135deg, #12201a, #0d1117 60%); }
  .text { margin-left: 72px; width: 480px; flex: none; }
  #icon { width: 128px; height: 128px; display: block; margin: -12px; }
  h1 { margin: 30px 0 0; font-size: 54px; white-space: nowrap; line-height: 1; font-weight: 800; letter-spacing: -1.6px; color: #fff; }
  .line { margin: 18px 0 0; font-size: 34px; white-space: nowrap; line-height: 1.15; font-weight: 700; letter-spacing: -.5px; color: #e3e8ee; }
  .more { margin: 20px 0 0; font-size: 23px; line-height: 1.35; font-weight: 600; color: #6fdc8c; }
  #shot { width: 640px; margin-left: 20px; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .14), 0 24px 60px rgba(0, 0, 0, .5); display: block; }
</style>
</head>
<body>
<div class="text">
  <img id="icon" alt="" src="../../desktop/build/icon.png">
  <h1>GitHub AutoSync</h1>
  <p class="line">GitHub for knowledge work.</p>
  <p class="more">Your files sync themselves.<br>Every change kept in git.</p>
</div>
<img id="shot" alt="">
<script>
  document.getElementById('shot').src = JSON.parse(new URLSearchParams(location.search).get('p')).shot
</script>
</body>
</html>
