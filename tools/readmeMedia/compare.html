<!doctype html>
<!--
  The comparison picture, 1600 × 900: Google Drive, GitHub on its own, and GitHub AutoSync, one row
  per thing a reader gets. Its own dark card (rounded, transparent outside) reads on GitHub's
  light and dark pages alike. All rows are in ROWS below — a row change is one line; README.md
  repeats them in the picture's alt text, so change the two together.

  Logos (logos/): Google Drive's own multicolour mark, from Wikimedia Commons, on a white tile; the
  GitHub mark from Simple Icons (CC0), drawn white as GitHub's logo rules allow. Both marks
  belong to their owners. The app column uses the app's own icon.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub AutoSync comparison</title>
<style>
  html, body { margin: 0; background: transparent; }
  body { width: 1600px; height: 900px; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1600px; height: 900px; border-radius: 34px; overflow: hidden; background: radial-gradient(900px 700px at 1385px 450px, rgba(46, 160, 67, .34), transparent 70%), linear-gradient(135deg, #14201b, #0d1117); }
  /* The app's column: one bright panel behind its cells, taller than the rows, so it stands in front. */
  .ours { position: absolute; left: 1232px; top: 14px; width: 320px; height: 872px; border-radius: 28px; background: linear-gradient(180deg, #2ea043 0%, #13804a 55%, #0d6a5c 100%); box-shadow: 0 0 0 1px rgba(255, 255, 255, .22) inset, 0 18px 70px rgba(46, 160, 67, .6); }
  .grid { position: absolute; left: 48px; top: 26px; width: 1504px; display: grid; grid-template-columns: 604px 290px 290px 320px; }
  .head { height: 128px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aeb6c2; }
  .head .nm { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 700; letter-spacing: -.3px; }
  .head small { font-size: 22px; font-weight: 500; color: #8b94a3; }
  .head.us .nm { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -.6px; gap: 6px; white-space: nowrap; }
  .tile { width: 46px; height: 46px; border-radius: 11px; background: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .tile img { width: 30px; display: block; }
  .mark { width: 38px; height: 38px; display: block; filter: invert(1); }
  .head.us img { width: 64px; height: 64px; margin: -8px -4px -8px -8px; }
  .name, .cell { height: 92px; border-top: 1px solid rgba(255, 255, 255, .1); }
  .name { display: flex; align-items: center; font-size: 33px; font-weight: 700; letter-spacing: -.4px; color: #fff; white-space: nowrap; }
  .name small { margin-left: 13px; font-size: 24px; font-weight: 500; letter-spacing: -.1px; color: #949cab; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .cell.us { border-top-color: rgba(255, 255, 255, .26); }
  .cell svg { width: 42px; height: 42px; display: block; }
  .cell.us svg { width: 48px; height: 48px; filter: drop-shadow(0 4px 10px rgba(5, 60, 30, .45)); }
  .cell span { font-size: 21px; font-weight: 600; line-height: 1.1; color: #fca5a5; }
</style>
</head>
<body>
<div class="card">
  <div class="ours"></div>
  <div class="grid" id="grid">
    <div class="head"></div>
    <div class="head"><span class="nm"><i class="tile"><img alt="" src="logos/google-drive.svg"></i>Google Drive</span></div>
    <div class="head"><span class="nm"><img class="mark" alt="" src="logos/github.svg">GitHub</span><small>(on its own)</small></div>
    <div class="head us"><span class="nm"><img alt="" src="../../desktop/build/icon.png">GitHub AutoSync</span></div>
  </div>
</div>
<script>
  const YES = '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="18" fill="#22c55e"/><path d="M10.5 18.6 l5 5 l10 -10.6" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  const NO = '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="18" fill="#ef4444"/><path d="M12 12 l12 12 M24 12 l-12 12" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"/></svg>'
  const OURS = '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="18" fill="#fff"/><path d="M10.5 18.6 l5 5 l10 -10.6" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  // [what the reader gets, its small print, Google Drive, GitHub on its own] — a cell is yes / no, or
  // [yes / no, a note]. GitHub AutoSync is always yes.
  const ROWS = [
    ['Real files on your computer', 'agent native', [false, 'Online-only by default'], true],
    ['Every version kept', 'full history', [false, 'Deleted after 30 days'], true],
    ['See what changed', 'line by line, which computer', [false, 'Whole-file versions'], true],
    ['Syncs by itself', 'no commit, no push', true, [false, 'You commit and push']],
    ['Your team has it in a minute', '', true, [false, 'When someone pushes']],
    ['Works with pull-request rules', 'team repos', [false, 'Not git'], true],
    ['An AI prompt for every problem', '', false, false],
    ['Open source', '', false, true],
  ]
  const grid = document.getElementById('grid')
  const add = (className, html) => {
    const el = document.createElement('div')
    el.className = className
    el.innerHTML = html
    grid.append(el)
  }
  for (const [name, small, ...cells] of ROWS) {
    add('name', name + (small ? `<small>${small}</small>` : ''))
    for (const cell of cells) {
      const [yes, note] = Array.isArray(cell) ? cell : [cell, '']
      add('cell', (yes ? YES : NO) + (note ? `<span>${note}</span>` : ''))
    }
    add('cell us', OURS)
  }
</script>
</body>
</html>
