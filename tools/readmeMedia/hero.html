<!doctype html>
<!--
  The hero GIF, 1200 × 660: two computers side by side, the same file open on both. A line typed
  and saved on the left shows up on the right; the menu bar dot of each (the app's REAL tray
  PNGs) says what is going on, in the words of the app's own menu. The time chips keep it honest:
  the app sends 30 s after the last edit (DEBOUNCE_MS) and the other Mac pulls within a minute
  (POLL_MS). capture.mjs calls `frame(t)` for every frame, so the clip is drawn the same every run.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero</title>
<link rel="stylesheet" href="stage.css">
<style>
  body { width: 1200px; height: 660px; }
  .who { position: absolute; top: 16px; transform: translateX(-50%); padding: 7px 18px; border-radius: 999px; background: rgba(20, 26, 48, .82); color: #fff; font-size: 22px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; }
  .screen { position: absolute; top: 66px; width: 564px; height: 572px; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 3px rgba(20, 26, 48, .78), 0 18px 46px rgba(20, 30, 80, .35); }
  .screen .wallpaper { border-radius: 18px; }
  .chip { position: absolute; left: 600px; top: 570px; transform: translate(-50%, 0); padding: 13px 26px 13px 20px; border-radius: 999px; background: #161b22; color: #fff; font-size: 27px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); z-index: 30; }
  .chip svg { width: 30px; height: 30px; }
  .pulse { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 4px solid; z-index: 5; }
  .end { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(13, 17, 23, .94); color: #fff; }
  .end img { width: 120px; height: 120px; margin: -14px; }
  .end h1 { margin: 10px 0 0; font-family: var(--display); font-size: 54px; font-weight: 800; letter-spacing: -1.4px; }
  .end p { margin: 0; font-size: 26px; font-weight: 600; color: #7ee2a8; }
</style>
</head>
<body>
<div class="wallpaper"><i class="wave"></i></div>
<script src="stage.js"></script>
<script>
  const TYPED = '- [ ] Email the waitlist on Monday'
  const FILE = [
    ['h', '# Spring launch'],
    ['', ''],
    ['done', '- [x] Final pricing page'],
    ['done', '- [x] Record the demo video'],
    ['', '- [ ] Press kit to partners'],
    ['', '- [ ] Book the launch webinar'],
  ]
  // Seconds. Each side's dot: [from, state].
  const T = { point: [0.5, 1.2], click: 1.3, type: [1.7, 3.3], save: [3.4, 4.6], chip1: [4.7, 6.9], chip2: [7.2, 9.4], fade: [9.6, 10.6], end: [10.6, 11.0] }
  const LEFT = [[0, 'synced'], [3.8, 'pending'], [5.6, 'syncing'], [6.6, 'synced']]
  const RIGHT = [[0, 'synced'], [7.9, 'syncing'], [8.8, 'synced']]
  const ARRIVES = 8.8
  window.DURATION = 13.4

  const body = document.body
  const who = (text, x) => add(body, text, 'who', { left: x })

  function screen(x, label) {
    who(label, x + 282)
    const el = add(body, '<div class="wallpaper"><i class="wave"></i></div>', 'screen', { left: x })
    const paper = el.firstChild
    const bar = menubar({ app: 'Editor', menus: ['File', 'Edit', 'View'], u: 2, clock: '9:41', glyphs: false })
    paper.append(bar)
    const editor = add(paper, '<div class="bar"><div class="lights"><i></i><i></i><i></i></div><div class="title">launch-plan.md</div></div><div class="text"></div>', 'editor', { left: 26, top: 172, width: 512, height: 338 })
    const text = editor.querySelector('.text')
    text.innerHTML = FILE.map(([cls, line]) => `<div class="line ${cls}">${line || ' '}</div>`).join('') + '<div class="line typed"></div>'
    const tray = bar.querySelector('[data-dot]')
    const say = add(paper, '', 'say')
    const pulse = add(paper, '', 'pulse')
    return { el, paper, editor, typed: text.querySelector('.typed'), tray, say, pulse, shown: null }
  }
  const left = screen(24, 'Your laptop')
  const right = screen(612, 'Your teammate’s Mac')
  for (const side of [left, right]) {
    // The word sits under the dot, the pulse on it: measured once the menu bar is laid out.
    const d = side.tray.getBoundingClientRect()
    const s = side.paper.getBoundingClientRect()
    side.dot = { x: d.left - s.left + d.width / 2, y: d.top - s.top + d.height / 2 }
    place(side.say, { left: side.dot.x, top: side.dot.y + 34 })
    place(side.pulse, { left: side.dot.x, top: side.dot.y })
  }

  const ptr = pointer(0, 0)
  left.paper.append(ptr)
  const ring = add(left.paper, '', 'ring')
  const keycaps = keys(['⌘', 'S'], 'Save')
  left.paper.append(place(keycaps, { left: 150, top: 474 }))
  const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="#7ee2a8" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.8V12l3.6 2.2"/></svg>'
  const chip1 = add(body, `${CLOCK}30 s later`, 'chip')
  const chip2 = add(body, `${CLOCK}Under a minute later`, 'chip')
  const end = add(body, `<img alt="" src="${ICON}"><h1>No commit. No push. Already there.</h1><p>GitHub AutoSync</p>`, 'end')

  /** Where the new line goes in the left editor, in that screen's px. */
  function slot() {
    const r = left.typed.getBoundingClientRect()
    const s = left.paper.getBoundingClientRect()
    return { x: r.left - s.left, y: r.top - s.top + r.height / 2 }
  }

  const stateAt = (timeline, t) => timeline.filter(([from]) => from <= t).at(-1)
  const visible = (el, t, [a, b], fadeIn = 0.25) => {
    const o = Math.min(ramp(t, a, a + fadeIn), 1 - ramp(t, b - fadeIn, b))
    el.style.opacity = o
    el.style.display = o > 0 ? '' : 'none'
  }

  function showDot(side, timeline, t) {
    const [from, state] = stateAt(timeline, t)
    const previous = stateAt(timeline, from - 0.001)
    const k = previous ? ramp(t, from, from + 0.25) : 1
    if (k < 1) {
      setDot(side.tray, previous[1], 1)
      setDot(side.tray, state, k)
    } else setDot(side.tray, state, 1)
    side.say.className = `say ${state}`
    side.say.innerHTML = `<i></i>${WORD[state]}`
    // A ring goes out from the dot when it changes.
    const p = previous ? (t - from) / 0.7 : 1
    side.pulse.style.display = p < 1 ? '' : 'none'
    if (p < 1) {
      side.pulse.style.borderColor = getComputedStyle(document.documentElement).getPropertyValue(`--${{ synced: 'green', pending: 'amber', syncing: 'blue' }[state]}`)
      side.pulse.style.transform = `scale(${1 + p * 1.8})`
      side.pulse.style.opacity = 1 - p
    }
  }

  window.frame = async (t) => {
    showDot(left, LEFT, t)
    showDot(right, RIGHT, t)

    // Typing on the left: the pointer clicks where the new line goes, the line types, ⌘S saves it.
    const n = Math.round(TYPED.length * ramp(t, ...T.type) ** 0.9 * (t >= T.type[0] ? 1 : 0))
    const typing = t >= T.type[0] - 0.4 && t < T.save[0] + 0.4
    left.typed.innerHTML = (TYPED.slice(0, n) || '') + (typing ? '<span class="caret"></span>' : '') || ' '
    const at = slot()
    const k = ramp(t, ...T.point)
    movePointer(ptr, 300 + (at.x + 12 - 300) * k, 520 + (at.y - 520) * k)
    ptr.style.display = t >= T.point[0] && t < T.type[0] ? '' : 'none'
    const r = (t - T.click) / 0.45
    ring.style.display = r >= 0 && r < 1 ? '' : 'none'
    Object.assign(ring.style, { left: `${at.x + 12}px`, top: `${at.y}px`, transform: `scale(${0.35 + r * 0.9})`, opacity: 1 - r })
    visible(keycaps, t, T.save, 0.12)

    // The line arrives on the right, lit up for a moment.
    right.typed.textContent = t >= ARRIVES ? TYPED : ' '
    const glow = t >= ARRIVES ? 1 - ramp(t, ...T.fade) : 0
    right.typed.classList.toggle('new', glow > 0)
    right.typed.style.backgroundColor = `rgba(46, 160, 67, ${0.22 * glow})`
    right.typed.style.boxShadow = glow > 0 ? `inset ${3 * glow}px 0 0 rgba(46, 160, 67, ${glow})` : 'none'
    left.typed.classList.toggle('new', false)

    visible(chip1, t, T.chip1)
    visible(chip2, t, T.chip2)
    visible(end, t, [T.end[0], window.DURATION + 1], T.end[1] - T.end[0])

    await Promise.all([...document.images].map((img) => (img.src ? img.decode().catch(() => {}) : null)))
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)))
  }
  window.frame(0)
</script>
</body>
</html>
